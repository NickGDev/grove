server:
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: grove
  datasource:
    url: jdbc:sqlite:build/test.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-init-sql: PRAGMA foreign_keys=ON; PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;
      data-source-properties:
        # xerial stores/reads java.sql dates as text so LocalDate/Time/Timestamp round-trip
        date_class: text
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: localhost

logging:
  level:
    ie.grove: INFO
