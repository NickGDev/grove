<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Easy fees')}"></head>
<body class="bg-canvas text-ink font-sans antialiased" hx-boost="true">
  <div th:replace="~{layout :: nav('fees')}"></div>

  <main class="page">
    <h1 class="text-[28px] font-semibold tracking-[-0.03em]">Easy fees</h1>
    <p class="mt-1 text-[15px] text-muted">Who owes what, one week at a time.</p>

    <div th:replace="~{admin/fragments/fees-panel :: panel}"></div>
  </main>

  <!-- Toast -->
  <div x-data="{ msg: null }" @payment-recorded.window="msg = 'Payment recorded'; const id = window.__grovePaidRow; if (id) setTimeout(() => window.dispatchEvent(new CustomEvent('row-focus', { detail: id })), 50); setTimeout(() => msg = null, 3000)">
    <div x-show="msg" x-cloak x-text="msg" role="status"
         class="fixed bottom-[88px] left-1/2 z-50 -translate-x-1/2 rounded-[10px] bg-ink px-4 py-3 text-[15px] text-panel md:bottom-6">Payment recorded</div>
  </div>

  <script>
    document.body.addEventListener('htmx:responseError', () => window.dispatchEvent(new CustomEvent('fees-error')));
  </script>
</body>
</html>
