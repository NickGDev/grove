<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" th:content="${_csrf != null} ? ${_csrf.token} : ''">
  <title>Sign-in link · Grove</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/webauthn.js}" defer></script>
</head>
<body class="bg-canvas text-ink font-sans antialiased">
  <main class="mx-auto flex min-h-dvh w-full max-w-[440px] flex-col justify-center px-4 py-10">
    <div class="mb-8 flex items-center gap-3">
      <span class="flex size-9 items-center justify-center rounded-full bg-peach">
        <svg viewBox="0 0 24 24" class="size-[18px]" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4-3-7-6.5-7-10a7 7 0 0 1 14 0c0 3.5-3 7-7 10Z"/><path d="M12 3v4"/></svg>
      </span>
      <h1 class="text-[22px] font-semibold tracking-[-0.03em]">Grove</h1>
    </div>

    <div class="rounded-card border border-line bg-panel p-6 sm:p-8">
      <h2 class="text-[28px] font-semibold tracking-[-0.03em]">Sign-in link</h2>

      <div th:if="${sent}" class="mt-4 rounded-ctl border border-paid/50 bg-paid/15 px-4 py-3 text-[14px]" role="status">
        If that email is with us, a sign-in link is on its way. It works for 10 minutes and once only.
      </div>

      <form th:action="@{/login/link}" method="post" class="mt-6 flex flex-col gap-4">
        <div>
          <label for="username" class="mb-2 block text-[13px] font-normal uppercase tracking-[0.04em] text-muted">Email</label>
          <input type="email" id="username" name="username" required autocomplete="email" autofocus
                 class="h-11 w-full rounded-ctl border border-line bg-panel px-4 text-[15px] outline-none focus-visible:ring-2 focus-visible:ring-ink/60">
        </div>
        <button type="submit" class="mt-1 h-11 rounded-ctl bg-ink text-[15px] font-medium text-panel hover:opacity-90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          Email me a link
        </button>
      </form>

      <div th:if="${webauthnEnabled}" class="mt-5 border-t border-line pt-2 text-center">
        <div id="passkey-error" hidden class="mb-2 rounded-ctl border border-overdue/40 bg-overdue/10 px-4 py-3 text-left text-[14px]" role="alert">
          That passkey didn't work. Try again or use a link.
        </div>
        <button type="button" id="passkey-btn"
                onclick="const b=this,e=document.getElementById('passkey-error');b.disabled=true;e.hidden=true;groveWebAuthn.signin().then(u=>window.location=u).catch(()=>{e.hidden=false;b.disabled=false})"
                class="inline-flex min-h-[44px] w-full items-center justify-center gap-2 text-[14px] text-muted underline-offset-4 hover:text-ink hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-ink disabled:opacity-50">
          <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="12" r="3"/><path d="m11 12h9m-3 0v3"/></svg>
          Use a passkey instead
        </button>
      </div>
    </div>

    <p class="mt-6 text-center text-[14px] text-muted">Rather type it? <a href="/login" class="inline-flex min-h-[44px] items-center text-ink underline underline-offset-4">Sign in with a password</a></p>
  </main>
</body>
</html>
