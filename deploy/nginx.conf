# Grove — reverse proxy in front of the app container (see docker-compose.yml).
# In a real deployment TLS termination lives here; the compose demo serves
# plain HTTP on localhost, which is still a secure context, so passkeys work.
server {
    listen 80;
    server_name _;

    # Photos and signed-form PDFs upload through this proxy.
    client_max_body_size 10m;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        # $http_host keeps any non-standard port; X-Forwarded-Host drives
        # Spring's ForwardedHeaderFilter so app-built URLs (magic links) carry
        # the published host:port. No X-Forwarded-Port: $server_port is the
        # port nginx listens on inside the container (80), which would clobber
        # the port in X-Forwarded-Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
    }
}
